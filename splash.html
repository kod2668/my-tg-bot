<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinon AI - Welcome</title>
    <style>
        :root {
            /* Logo နဲ့ ကိုက်ညီတဲ့ အမည်းရောင်/မီးခိုးရောင် background */
            --bg-color: #0b0c10;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInScale 1.2s ease-in-out;
        }

        .logo-container img {
            width: 240px;
            max-width: 80vw;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(138, 180, 248, 0.2));
            margin-bottom: 20px;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #8ab4f8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Boss ပို့ပေးထားတဲ့ Logo ပုံကို ဒီနေရာမှာ ထည့်ပါ (ဥပမာ - logo.png လို့ နာမည်ပေးနိုင်ပါတယ်) -->
        <img src="Xinon-Logo.png" alt="Xinon-Logo.png">
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // ၁.၈ စက္ကန့်ပြည့်တာနဲ့ index.html (Chat မျက်နှာပြင်) ဆီသို့ အလိုအလျောက် သွားမည်
        setTimeout(function() {
            window.location.href = "index.html";
        }, 1800);
    </script>
</body>
</html>
