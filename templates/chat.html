<!DOCTYPE html>
<html lang="my" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinon AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .message-content pre { background-color: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .message-content code { font-family: monospace; background-color: rgba(0,0,0,0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .message-content pre code { background-color: transparent; padding: 0; }
        .message-content p { margin-bottom: 0.75rem; }
        .message-content p:last-child { margin-bottom: 0; }
        /* Custom Scrollbar for Drawer */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#131314] text-[#e3e3e3] h-full flex overflow-hidden">

    <!-- Backdrop Overlay for Drawer -->
    <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar / Drawer (Gemini Style) -->
    <aside id="app-drawer" class="fixed inset-y-0 left-0 w-72 bg-[#1e1f20] z-50 flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-[#2b2d31]">
        <!-- Drawer Header -->
        <div class="flex items-center justify-between px-4 py-4 border-b border-[#2b2d31]">
            <span class="text-lg font-semibold text-white flex items-center gap-2">
                <i class="fa-solid fa-sparkles text-blue-400"></i> Xinon
            </span>
            <button onclick="toggleDrawer(false)" class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-[#2b2d31] transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Drawer Menu Items -->
        <div class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <button onclick="startNewChat()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-full bg-[#282a2c] hover:bg-[#333538] text-white text-sm font-medium transition mb-4">
                <i class="fa-solid fa-plus text-blue-400"></i> New chat
            </button>
            <div class="text-xs font-semibold text-gray-400 px-3 pb-2 uppercase tracking-wider">Recent</div>
            <div class="space-y-1 text-sm text-gray-300">
                <div class="px-3 py-2 rounded-lg hover:bg-[#2b2d31] truncate cursor-pointer transition">Xinon AI Introduction</div>
                <div class="px-3 py-2 rounded-lg hover:bg-[#2b2d31] truncate cursor-pointer transition">Python Flask & Database Setup</div>
            </div>
        </div>

        <!-- Drawer Footer -->
        <div class="p-3 border-t border-[#2b2d31] bg-[#1e1f20] space-y-2">
            <div class="flex items-center gap-2">
                <!-- KOD Channel Button -->
                <a href="https://t.me/REDXinon" target="_blank" class="flex-1 bg-[#282a2c] hover:bg-[#333538] text-white text-xs font-medium py-2.5 px-3 rounded-full text-center truncate transition flex items-center justify-center gap-1.5">
                    <i class="fa-brands fa-telegram text-blue-400"></i> KOD CHANNEL
                </a>
                <!-- Upgrade Button -->
                <a href="https://t.me/REDXinon" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 px-4 rounded-full text-center transition shadow-md">
                    Upgrade
                </a>
                <!-- Settings Icon Button -->
                <button onclick="openSettings()" class="text-gray-300 hover:text-white p-2.5 rounded-full hover:bg-[#282a2c] transition">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Settings Modal / Page View -->
    <div id="settings-modal" class="fixed inset-0 bg-[#131314] z-50 hidden flex flex-col">
        <!-- Settings Header -->
        <div class="flex items-center px-4 py-3 border-b border-[#2b2d31] bg-[#1e1f20]">
            <button onclick="closeSettings()" class="text-gray-300 hover:text-white p-2 rounded-full hover:bg-[#2b2d31] transition mr-3">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h2 class="text-lg font-semibold text-white">Settings</h2>
        </div>

        <!-- Settings Body -->
        <div class="flex-1 overflow-y-auto max-w-2xl w-full mx-auto p-4 space-y-6">
            <!-- Upgrade to VIP Option -->
            <a href="https://t.me/REDXinon" target="_blank" class="block bg-[#1e1f20] border border-[#2b2d31] hover:border-gray-500 p-4 rounded-2xl transition shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-telegram text-blue-400 text-xl"></i>
                        <div>
                            <div class="text-sm font-medium text-white">Upgrade to VIP (Contact Telegram)</div>
                            <div class="text-xs text-gray-400">Get unlimited code generation and premium access</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                </div>
            </a>

            <!-- Device ID Box -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Your Device ID (Send this to Owner for VIP)</label>
                <div class="flex items-center bg-[#1e1f20] border border-[#2b2d31] rounded-xl px-4 py-3">
                    <input type="text" id="setting-device-id" readonly class="w-full bg-transparent text-white text-sm font-mono focus:outline-none select-all" value="">
                    <button onclick="copyDeviceId()" class="ml-2 text-xs bg-[#2b2d31] hover:bg-[#3c4043] text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shrink-0">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface Container -->
    <div class="flex-1 flex flex-col h-full w-full relative">
        <!-- Top Header -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-[#2b2d31] bg-[#131314] shrink-0">
            <div class="flex items-center space-x-3">
                <button onclick="toggleDrawer(true)" class="text-gray-300 hover:text-white p-2 rounded-full hover:bg-[#2b2d31] transition">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <span class="text-lg font-semibold tracking-wide text-white flex items-center gap-2">
                    Xinon
                </span>
            </div>
            <div class="flex items-center space-x-2">
                <a href="/" class="text-sm bg-[#1e1f20] hover:bg-[#2b2d31] px-3 py-1.5 rounded-lg text-gray-300 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-3xl w-full mx-auto">
            <!-- Welcome / Greeting State -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center space-y-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-xl shadow-lg">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
                    Hello, Boss
                </h1>
                <p class="text-gray-400 text-sm md:text-base">How can Xinon help you today?</p>
            </div>

            <!-- Messages will be appended here dynamically -->
            <div id="chat-messages" class="space-y-6 hidden"></div>
        </main>

        <!-- Input Area -->
        <div class="shrink-0 max-w-3xl w-full mx-auto px-4 pb-4 pt-2">
            <!-- Preview Attached Image -->
            <div id="image-preview-container" class="hidden mb-2 relative inline-block">
                <img id="image-preview" src="" alt="Preview" class="h-20 w-20 object-cover rounded-xl border border-gray-700">
                <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-gray-800 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="bg-[#1e1f20] rounded-3xl p-3 border border-[#2b2d31] focus-within:border-gray-500 transition shadow-lg">
                <textarea id="user-input" rows="1" placeholder="Enter a prompt here..." 
                    class="w-full bg-transparent text-white placeholder-gray-400 focus:outline-none resize-none px-2 max-h-36 text-sm md:text-base leading-relaxed"
                    oninput="autoResize(this)"></textarea>

                <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-700/40">
                    <div class="flex items-center space-x-2">
                        <!-- Image Upload Button (Fixed with for & id) -->
                        <label for="image-input" class="cursor-pointer text-gray-400 hover:text-white p-2 rounded-full hover:bg-gray-700/50 transition inline-flex items-center justify-center">
                            <i class="fa-solid fa-image text-lg pointer-events-none"></i>
                        </label>
                        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                    </div>
                    <!-- Send Button -->
                    <button id="send-btn" onclick="sendMessage()" class="bg-white text-black hover:bg-gray-200 p-2.5 rounded-full w-9 h-9 flex items-center justify-center transition disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </div>
            <div class="text-center mt-2">
                <span class="text-[11px] text-gray-500">Xinon may display inaccurate info. Verify important facts.</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let selectedImageFile = null;

        function toggleDrawer(open) {
            const drawer = document.getElementById('app-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            if (open) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function openSettings() {
            toggleDrawer(false);
            document.getElementById('setting-device-id').value = getDeviceId();
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function copyDeviceId() {
            const input = document.getElementById('setting-device-id');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Device ID copied to clipboard!");
        }

        function startNewChat() {
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
            toggleDrawer(false);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImageFile = null;
            document.getElementById('image-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        function getDeviceId() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlDeviceId = urlParams.get('device_id');
            if (urlDeviceId) {
                localStorage.setItem('saved_device_id', urlDeviceId);
                return urlDeviceId;
            }

            const savedId = localStorage.getItem('saved_device_id');
            if (savedId) {
                return savedId;
            }

            try {
                if (window.Android && window.Android.getDeviceId) {
                    const androidId = window.Android.getDeviceId();
                    if (androidId) {
                        localStorage.setItem('saved_device_id', androidId);
                        return androidId;
                    }
                }
            } catch (e) {}

            return "055f419d68dab9df"; 
        }

        function getUserId() {
            return 7094887417; // Boss ID
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const promptText = inputField.value.trim();
            if (!promptText && !selectedImageFile) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.classList.remove('hidden');

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'flex justify-end';
            let imageHtml = selectedImageFile ? `<img src="${URL.createObjectURL(selectedImageFile)}" class="max-w-xs rounded-xl mb-2">` : '';
            userMsgDiv.innerHTML = `
                <div class="bg-[#2b2d31] text-white px-4 py-3 rounded-2xl max-w-[80%] text-sm md:text-base">
                    ${imageHtml}
                    <p class="whitespace-pre-wrap">${escapeHtml(promptText)}</p>
                </div>
            `;
            chatMessages.appendChild(userMsgDiv);

            const currentImage = selectedImageFile;
            inputField.value = '';
            inputField.style.height = 'auto';
            removeImage();
            scrollToBottom();

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'flex space-x-3 items-start';
            aiMsgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white text-xs shrink-0 mt-1">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <div class="flex-1 space-y-2 overflow-hidden">
                    <div class="font-semibold text-sm text-gray-300">Xinon</div>
                    <div class="message-content text-gray-200 text-sm md:text-base leading-relaxed">
                        <span class="inline-block animate-pulse">Thinking...</span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(aiMsgDiv);
            scrollToBottom();

            const messageContentEl = aiMsgDiv.querySelector('.message-content');

            try {
                let response;
                const device_id = getDeviceId();
                const user_id = getUserId();

                if (currentImage) {
                    const formData = new FormData();
                    formData.append('prompt', promptText);
                    formData.append('device_id', device_id);
                    formData.append('user_id', user_id);
                    formData.append('image', currentImage);

                    response = await fetch('/api/chat', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: promptText, device_id: device_id, user_id: user_id })
                    });
                }

                if (!response.ok) throw new Error("Network response was not ok");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    accumulatedText += decoder.decode(value, { stream: true });
                    messageContentEl.innerHTML = marked.parse(accumulatedText);
                    scrollToBottom();
                }

            } catch (error) {
                messageContentEl.innerHTML = `<span class="text-red-400">[Error: Failed to connect to server]</span>`;
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
