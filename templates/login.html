<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinon AI - Sign in with Google</title>
    <!-- Google Platform Library for Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 35px;
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 20px;
            background-color: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">Xinon AI</div>
        <div class="subtitle">Login with your Google account</div>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <!-- Google Sign-In Button Container -->
        <div class="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="605485713143-4515rlaf2763jnbvclb49ecrvpfrhqb9.apps.googleusercontent.com"
                 data-login_uri="https://my-tg-bot-production-c55e.up.railway.app/auth/google/callback"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>
</body>
</html>
